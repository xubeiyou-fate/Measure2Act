[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "measure2act"
version = "1.0.0"
description = "Modular probability transfer for multimodal aircraft trajectory prediction"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11,<3.13"
authors = [
  {name = "Hang Xu"},
  {name = "Daoming Xu"},
  {name = "Tianyi Zhao"},
]
keywords = [
  "aircraft trajectory prediction",
  "multimodal forecasting",
  "probability transfer",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.1,<3",
  "timm>=1.0,<2",
  "tqdm>=4.66,<5",
  "matplotlib>=3.8,<4",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
test = ["pytest>=7,<9", "build>=1,<2"]
release = ["cyclonedx-bom>=4,<7"]

[project.scripts]
measure2act-operator = "Measure2Act_probability_transfer.run:main"
measure2act-train = "Measure2Act_forecasting.run_train:main"
measure2act-evaluate = "Measure2Act_forecasting.run_evaluate:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
  "Measure2Act_*",
  "airroute_stage_m*",
  "causal_mode_generation*",
  "continuous_geometry*",
  "experiments*",
  "mabpt*",
  "measure2act_ast_tools*",
  "mode_state_query*",
  "model*",
  "modern_baseline*",
  "proper_set_ascent*",
  "tail_query*",
]
exclude = ["tests*", "*.tests*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
